<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>StreamDemo</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
  h1 { color: #fff; }
  .controls { margin-bottom: 20px; }
  .controls input[type="text"] { padding: 6px; width: 220px; }
  .controls label { margin-left: 16px; }
  .row { margin-bottom: 24px; }
  .row h2 { font-size: 16px; color: #aaa; text-transform: uppercase; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: #222; border-radius: 6px; padding: 12px; width: 220px; }
  .card h3 { margin: 0 0 8px 0; font-size: 16px; }
  .card .meta { font-size: 12px; color: #999; margin-bottom: 8px; }
  .progress-bar-track { background: #444; height: 6px; border-radius: 3px; margin-bottom: 8px; }
  .progress-bar-fill { background: #4caf50; height: 6px; border-radius: 3px; }
  .card input[type="number"] { width: 50px; }
  .card button { margin-top: 6px; padding: 4px 8px; cursor: pointer; }
  .card button:disabled { opacity: 0.4; cursor: not-allowed; }
  .empty-message { color: #888; font-style: italic; }
</style>
</head>
<body>

  <h1>StreamDemo</h1>

  <div class="controls">
    <input type="text" id="search-input" data-testid="search-input" placeholder="Search shows..." />
    <label>
      <input type="checkbox" id="premium-toggle" data-testid="premium-toggle" />
      Premium account
    </label>
    <label>
      <input type="checkbox" id="storage-toggle" data-testid="storage-toggle" />
      Storage available
    </label>
  </div>

  <div class="row">
    <h2>Continue Watching</h2>
    <div class="cards" id="continue-watching-row" data-testid="continue-watching-row"></div>
  </div>

  <div class="row">
    <h2>All Shows</h2>
    <div class="cards" id="all-shows-row" data-testid="all-shows-row"></div>
  </div>

<script>
  // ---- "Database" of shows. In a real app this would come from an API. ----
  const SHOWS = [
    { id: 1, title: "Nebula Heights",     licensedOffline: true  },
    { id: 2, title: "Coastal Detectives", licensedOffline: false },
    { id: 3, title: "The Last Signal",    licensedOffline: true  },
    { id: 4, title: "Kitchen Wars",       licensedOffline: false },
    { id: 5, title: "Nightshade",         licensedOffline: true  },
  ];

  // ---- Progress is kept in localStorage so it persists across page loads. ----
  function getProgress(showId) {
    const raw = localStorage.getItem("progress_" + showId);
    return raw === null ? 0 : parseInt(raw, 10);
  }

  function setProgress(showId, value) {
    let clamped = Math.max(0, Math.min(100, value));
    localStorage.setItem("progress_" + showId, clamped);
    render();
  }

  function isDownloadEnabled(show) {
    const premium = document.getElementById("premium-toggle").checked;
    const storage = document.getElementById("storage-toggle").checked;
    return premium && storage && show.licensedOffline;
  }

  function matchesSearch(show, query) {
    if (!query) return true;
    return show.title.toLowerCase().includes(query.toLowerCase());
  }

  function buildCard(show) {
    const progress = getProgress(show.id);
    const downloadEnabled = isDownloadEnabled(show);

    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-testid", "show-card-" + show.id);

    card.innerHTML = `
      <h3>${show.title}</h3>
      <div class="meta">${show.licensedOffline ? "Licensed for offline" : "Streaming only"}</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${progress}%"></div>
      </div>
      <div class="meta" data-testid="progress-label-${show.id}">${progress}% watched</div>

      <input
        type="number"
        min="0"
        max="100"
        value="${progress}"
        data-testid="progress-input-${show.id}"
      />
      <button data-testid="set-progress-btn-${show.id}">Set progress</button>
      <br/>
      <button
        data-testid="download-btn-${show.id}"
        ${downloadEnabled ? "" : "disabled"}
      >
        Download for offline
      </button>
    `;

    card.querySelector(`[data-testid="set-progress-btn-${show.id}"]`)
      .addEventListener("click", () => {
        const input = card.querySelector(`[data-testid="progress-input-${show.id}"]`);
        setProgress(show.id, parseInt(input.value, 10));
      });

    return card;
  }

  function render() {
    const query = document.getElementById("search-input").value;
    const filtered = SHOWS.filter(show => matchesSearch(show, query));

    // Continue Watching: progress strictly between 0 and 100 (exclusive both ends)
    const continueWatching = filtered.filter(show => {
      const p = getProgress(show.id);
      return p > 0 && p < 100;
    });

    const allRow = document.getElementById("all-shows-row");
    const cwRow = document.getElementById("continue-watching-row");

    allRow.innerHTML = "";
    cwRow.innerHTML = "";

    if (filtered.length === 0) {
      allRow.innerHTML = `<div class="empty-message" data-testid="no-results-message">No shows match your search.</div>`;
    } else {
      filtered.forEach(show => allRow.appendChild(buildCard(show)));
    }

    if (continueWatching.length === 0) {
      cwRow.innerHTML = `<div class="empty-message" data-testid="no-continue-watching-message">Nothing in progress yet.</div>`;
    } else {
      continueWatching.forEach(show => cwRow.appendChild(buildCard(show)));
    }
  }

  document.getElementById("search-input").addEventListener("input", render);
  document.getElementById("premium-toggle").addEventListener("change", render);
  document.getElementById("storage-toggle").addEventListener("change", render);

  render();
</script>

</body>
</html>
